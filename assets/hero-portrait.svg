<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Portrait placeholder">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ff5a48"/>
      <stop offset="40%" stop-color="#e0101a"/>
      <stop offset="100%" stop-color="#180406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0805"/>
      <stop offset="100%" stop-color="#241009"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd0c6"/>
      <stop offset="50%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#d4101d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- dark base -->
  <rect width="900" height="1200" fill="#0a0606"/>

  <!-- big warm glow -->
  <circle cx="470" cy="430" r="430" fill="url(#glow)" filter="url(#soft)"/>

  <!-- figure: head + shoulders silhouette -->
  <g>
    <path d="M150,1200 C150,980 290,840 450,840 C610,840 750,980 750,1200 Z" fill="url(#figure)"/>
    <rect x="402" y="560" width="96" height="170" rx="40" fill="url(#figure)"/>
    <circle cx="450" cy="470" r="158" fill="url(#figure)"/>
  </g>

  <!-- glowing visor band across the head -->
  <g filter="url(#soft2)">
    <rect x="300" y="430" width="300" height="46" rx="23" fill="url(#visor)" opacity="0.95"/>
  </g>
  <rect x="300" y="442" width="300" height="20" rx="10" fill="#ffece9" opacity="0.9"/>

  <!-- subtle rim light on the right edge of the figure -->
  <path d="M750,1200 C750,980 610,840 450,840" fill="none" stroke="#ff4b3a" stroke-width="6" opacity="0.5" filter="url(#soft2)"/>
  <circle cx="600" cy="470" r="158" fill="none" stroke="#ff4b3a" stroke-width="0"/>
</svg>
