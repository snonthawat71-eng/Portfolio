# ผู้ช่วยอัตโนมัติ: เปิด GitHub Pages และอัปเดตเว็บทุกครั้งที่มีการแก้ไข
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/magical-cannon-ifwjyj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ทำงานทีละครั้ง ไม่ทับซ้อนกัน
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
