<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Graphic Designer</title>
  <meta name="description" content="Portfolio of a graphic designer — branding, posters, illustration and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- ปุ่มสลับภาษา (ไม่มี header) -->
  <button class="lang-toggle" id="langToggle" aria-label="Switch language" data-i18n="lang.toggle">TH</button>

  <main>
    <!-- ===================== ส่วนที่ 1: HERO ===================== -->
    <section class="hero" id="hero">
      <!-- แสงพื้นหลัง -->
      <div class="hero__glow" aria-hidden="true"></div>
      <!-- คำใหญ่จาง ๆ ด้านหลัง -->
      <div class="hero__outline" aria-hidden="true">DESIGN</div>

      <div class="hero__wrap">
        <!-- ซ้าย: ข้อความ -->
        <div class="hero__left reveal">
          <p class="eyebrow">
            <span class="eyebrow__dot"></span>
            <span data-i18n="hero.kicker">Graphic Designer · Portfolio</span>
          </p>
          <h1 class="hero__title">
            <span data-i18n="hero.title">Design that</span>
            <em data-i18n="hero.titleAccent">speaks first.</em>
          </h1>
          <p class="hero__lead" data-i18n="hero.tagline">A graphic designer turning ideas into striking visuals.</p>

          <div class="hero__actions">
            <a href="#work" class="btn btn--red" data-i18n="hero.cta">View Work</a>
            <a href="assets/resume.pdf" class="btn btn--ghost" download data-i18n="resume.cta">Download Resume</a>
          </div>

          <div class="hero__trusted">
            <div class="avatars">
              <span style="background:#ff5a48"></span>
              <span style="background:#e0202a"></span>
              <span style="background:#ff7a5c"></span>
              <span style="background:#b00f1a"></span>
            </div>
            <span class="hero__trusted-text" data-i18n="hero.trusted">Trusted by brands &amp; studios</span>
          </div>
        </div>

        <!-- ขวา: รูปคน + การ์ดสถิติ -->
        <div class="hero__right reveal">
          <div class="hero__portrait">
            <img src="assets/hero-portrait.svg" alt="Portrait" />
          </div>
          <div class="hero__stat hero__stat--a">
            <span class="hero__stat-num" data-i18n="hero.stat1n">120+</span>
            <span class="hero__stat-label" data-i18n="hero.stat1l">Projects done</span>
          </div>
          <div class="hero__stat hero__stat--b">
            <span class="hero__stat-num" data-i18n="hero.stat3n">40+</span>
            <span class="hero__stat-label" data-i18n="hero.stat3l">Happy clients</span>
          </div>
        </div>
      </div>

      <!-- แถบโลโก้/เครื่องมือ ด้านล่าง hero -->
      <div class="hero__logos" aria-label="Tools">
        <span>Photoshop</span>
        <span>Illustrator</span>
        <span>InDesign</span>
        <span>Figma</span>
        <span>After Effects</span>
      </div>
    </section>
  </main>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
